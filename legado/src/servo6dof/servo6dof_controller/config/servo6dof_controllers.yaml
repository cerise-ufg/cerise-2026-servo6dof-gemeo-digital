controller_manager:
  ros__parameters:
    # Era 10 Hz. A 10 Hz os /joint_states chegam a cada 100 ms, exatamente o
    # limite que o MoveIt usa para considerar o estado desatualizado -- ele
    # avisava "No state update received within 100ms" e rejeitava a trajetoria
    # com CONTROL_FAILED. 100 Hz e' o valor usual.
    update_rate: 100

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    #gripper_controller:
    #  type: forward_command_controller/ForwardCommandController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5

    command_interfaces:
      - position

    state_interfaces:
      - position

    open_loop_control: true
    allow_integration_in_goal_trajectories: true

gripper_controller:
  ros__parameters:
    joints:
      - joint_6
    # interface_name: position

    command_interfaces:
      - position

    state_interfaces:
      - position

    open_loop_control: true
    allow_integration_in_goal_trajectories: true
